spring.application.name=SpringMart

spring.datasource.url=${SpringMart_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SpringMart_DB_USERNAME}
spring.datasource.password=${SpringMart_DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

security.jwt.secret=${SpringMart_security_jwt_secret}
security.jwt.access-token-expiration=900000
security.jwt.refresh-token-expiration=604800000
security.jwt.token-type=Bearer 

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.model-and-view-allowed=true
springdoc.swagger-ui.use-root-path=false
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false
springdoc.override-with-generic-response=false